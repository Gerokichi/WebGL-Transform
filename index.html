<body>
 <canvas id="glCanvas" width="1505" height="500">
  <script src="js/glmatrix/gl-matrix.js"></script>
  <script src="js/GUI_Cube_sliders.js"></script>
 </canvas>
 <link rel="stylesheet" type="text/css"
       href="css/style.css">

<!-- Rotation-->
 <div class="slidegroupe">
  <div class="slidegroupeitem">
   <h3> Rotation X </h3>
   <div class="slidecontainer">
    <input type="range" min="0" max="360" value="0"
           class="slider" id="rotXrange"
           oninput="sliderRChange(this.value, 'x')" >
   </div>
  </div>

  <div class="slidegroupeitem">
   <h3> Rotation Y </h3>
   <div class="slidecontainer">
    <input type="range" min="0" max="360" value="0"
           class="slider" id="rotYrange"
           oninput="sliderRChange(this.value, 'y')" >
   </div>
  </div>

  <div class="slidegroupeitem">
   <h3> Rotation Z </h3>
   <div class="slidecontainer">
    <input type="range" min="0" max="360" value="0"
           class="slider" id="rotZrange"
           oninput="sliderRChange(this.value, 'z')" >
   </div>
  </div>
 </div>

 <!-- Translate-->
 <div class="slidegroupe">
<!--  <div class="slidegroupeitem">-->
<!--   <h3> Translate X </h3>-->
<!--   <div class="slidecontainer">-->
<!--    <input type="range" min="-4000" max="4000" value="0.0"-->
<!--           class="slider" id="translateXrange"-->
<!--           oninput="sliderTChange(this.value, 'x')" >-->
<!--   </div>-->
<!--  </div>-->

  <div class="slidegroupeitem">
   <h3> Translate Y </h3>
   <div class="slidecontainer">
    <input type="range" min="-1000" max="1000" value="0.0"
           class="slider" id="translateYrange"
           oninput="sliderTChange(this.value, 'y')" >
   </div>
  </div>

   <div class="slidegroupeitem">
    <h3> Uniform Scale </h3>
    <div class="slidecontainer">
     <input type="range" min="1" max="500" value="100.0"
            class="slider" id="uniformScale"
            oninput="sliderSChange(this.value, 'o')" >
    </div>
   </div>

  <div class="slidegroupeitem">
   <h3> Translate Z </h3>
   <div class="slidecontainer">
    <input type="range" min="0" max="20000" value="0.0"
           class="slider" id="translateZrange"
           oninput="sliderTChange(this.value, 'z')" >
   </div>
  </div>
 </div>

 <!-- Scale-->
 <div class="slidegroupe">
  <div class="slidegroupeitem">
   <h3> Scale X </h3>
   <div class="slidecontainer">
    <input type="range" min="-1000" max="1000" value="0.0"
           class="slider" id="scaleXrange"
           oninput="sliderSChange(this.value, 'x')" >
   </div>
  </div>

  <div class="slidegroupeitem">
   <h3> Scale Y </h3>
   <div class="slidecontainer">
    <input type="range" min="-1000" max="1000" value="0.0"
           class="slider" id="scaleYrange"
           oninput="sliderSChange(this.value, 'y')" >
   </div>
  </div>

  <div class="slidegroupeitem">
   <h3> Scale Z </h3>
   <div class="slidecontainer">
    <input type="range" min="-1000" max="1000" value="0.0"
           class="slider" id="scaleZrange"
           oninput="sliderSChange(this.value, 'z')" >
   </div>
  </div>
 </div>

 <p></p>
 <h3> Background Color </h3>
 <button class="button" onclick="setBckColor(0.0, 1.0, 0.0)"
 >Green</button>
 <button class="button button2" onclick="setBckColor(0.0, 0.0,
1.0)">Blue</button>
 <button class="button button3" onclick="setBckColor(1.0, 0.0,
0.0)">Red</button>
 <button class="button button4" onclick="setBckColor(0.7, 0.7,
0.7)">Gray</button>
 <button class="button button5" onclick="setBckColor(0.0, 0.0,
0.0)">Black</button>
</body>
